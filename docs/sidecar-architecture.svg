<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">WSLc agent sandbox with optional Tor egress</title>
  <desc id="desc">An agent on an internal network sends Ollama requests to a direct credential-injecting API proxy and general tool traffic to an allowlisting Squid proxy. In Tor mode Squid has no direct egress and uses an internal transit network to an unprivileged Privoxy and Tor gateway. A localhost monitor observes both proxies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#09121f"/><stop offset="1" stop-color="#101d31"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8ca3bc"/></marker>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#54b8ff"/></marker>
    <marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#54d69d"/></marker>
    <marker id="gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f0bd5b"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#eef5ff}.title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#9fb2c8}.frame{font-size:15px;font-weight:700;letter-spacing:.06em}.box{font-size:19px;font-weight:700}.body{font-size:14px;fill:#bfd0e3}.small{font-size:12px;fill:#9fb2c8}.line{fill:none;stroke:#8ca3bc;stroke-width:2.5;marker-end:url(#arrow)}.api{fill:none;stroke:#54d69d;stroke-width:3;marker-end:url(#green)}.tool{fill:none;stroke:#f0bd5b;stroke-width:3;marker-end:url(#gold)}.observe{fill:none;stroke:#b38cff;stroke-width:2;stroke-dasharray:6 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" rx="24" fill="url(#bg)"/>
  <text class="title" x="38" y="45">Isolated agent session · direct model API · optional Tor tool egress</text>
  <text class="sub" x="38" y="70">WSLc internal networks enforce the routes; proxy policy narrows destinations and credentials.</text>

  <rect x="25" y="92" width="1150" height="640" rx="20" fill="#0c1727" stroke="#38516e" stroke-width="2"/>
  <text class="frame" x="48" y="120">WINDOWS HOST / WSLC SESSION VM</text>

  <rect x="48" y="140" width="245" height="72" rx="13" fill="#17263a" stroke="#54b8ff" stroke-width="2"/>
  <text class="box" x="68" y="170">PowerShell launcher</text><text class="body" x="68" y="194">networks · containers · cleanup</text>
  <rect x="920" y="140" width="225" height="72" rx="13" fill="#251d35" stroke="#b38cff" stroke-width="2"/>
  <text class="box" x="940" y="170">Monitor UI</text><text class="body" x="940" y="194">localhost:8081 · optional</text>

  <rect x="48" y="242" width="405" height="430" rx="18" fill="#231722" stroke="#ec6f88" stroke-width="2"/>
  <text class="frame" x="68" y="271" fill="#ff8ca1">OC-INT · INTERNAL · NO GATEWAY / NAT</text>
  <rect x="78" y="304" width="255" height="135" rx="15" fill="#17263a" stroke="#54b8ff" stroke-width="2.5"/>
  <text class="box" x="98" y="338">Agent container</text><text class="body" x="98" y="365">OpenCode or Copilot BYOK</text><text class="body" x="98" y="389">workspace · no capabilities</text><text class="small" x="98" y="416">internal network only</text>
  <rect x="188" y="492" width="235" height="100" rx="14" fill="#152d2b" stroke="#54d69d" stroke-width="2.5"/>
  <text class="box" x="208" y="524">Ollama API proxy</text><text class="body" x="208" y="550">real key · model allowlist</text><text class="small" x="208" y="574">separate direct egress</text>

  <rect x="486" y="304" width="240" height="135" rx="15" fill="#2b2518" stroke="#f0bd5b" stroke-width="2.5"/>
  <text class="box" x="506" y="338">Squid allowlist</text><text class="body" x="506" y="365">HTTPS :443 · optional HTTP :80</text><text class="body" x="506" y="389">agent tool traffic only</text><text class="small" x="506" y="416">no direct interface in Tor mode</text>

  <rect x="764" y="260" width="360" height="205" rx="18" fill="#13231f" stroke="#54d69d" stroke-width="2"/>
  <text class="frame" x="786" y="289" fill="#71dfac">MODEL PATH · NEVER THROUGH TOR</text>
  <rect x="805" y="322" width="278" height="98" rx="14" fill="#17263a" stroke="#54d69d" stroke-width="2"/>
  <text class="box" x="829" y="356">Ollama Cloud</text><text class="body" x="829" y="383">HTTPS + injected real key</text><text class="small" x="829" y="404">API proxy owns the credential</text>

  <rect x="486" y="492" width="638" height="180" rx="18" fill="#1d1b2d" stroke="#b38cff" stroke-width="2" stroke-dasharray="8 7"/>
  <text class="frame" x="508" y="521" fill="#c3a8ff">TOR MODE · OC-TOR INTERNAL TRANSIT</text>
  <rect x="548" y="546" width="235" height="91" rx="14" fill="#27203a" stroke="#b38cff" stroke-width="2"/>
  <text class="box" x="569" y="578">Privoxy + Tor</text><text class="body" x="569" y="604">unprivileged · ephemeral</text><text class="small" x="569" y="624">verified IsTor: true</text>
  <rect x="855" y="546" width="225" height="91" rx="14" fill="#17263a" stroke="#f0bd5b" stroke-width="2"/>
  <text class="box" x="878" y="578">Allowed tools</text><text class="body" x="878" y="604">MCP · Git · packages</text><text class="small" x="878" y="624">or exact .onion services</text>

  <path class="line" d="M293 176H919"/><text class="small" x="538" y="164">starts and observes</text>
  <path class="api" d="M333 371C390 390 425 483 187 540"/><text class="small" x="347" y="455">/v1 placeholder</text>
  <path class="api" d="M423 542C575 515 658 370 804 370"/><text class="small" x="553" y="486">direct HTTPS</text>
  <path class="tool" d="M333 351H485"/><text class="small" x="361" y="338">HTTP(S) proxy</text>
  <path class="tool" d="M606 439V545"/><text class="small" x="617" y="474">mandatory parent</text>
  <path class="tool" d="M783 591H854"/>
  <path class="observe" d="M920 193C822 220 745 280 688 303"/><text class="small" x="765" y="237">UDP logs + manager</text>
  <path class="observe" d="M972 212V545"/>

  <path d="M348 420C407 433 432 422 465 400" fill="none" stroke="#ec6f88" stroke-width="2.5" stroke-dasharray="6 6"/>
  <line x1="455" y1="391" x2="473" y2="409" stroke="#ff8299" stroke-width="4"/><line x1="473" y1="391" x2="455" y2="409" stroke="#ff8299" stroke-width="4"/>
  <text class="small" x="350" y="446" fill="#ff9bad">direct agent internet blocked</text>
  <text class="small" x="505" y="657">Normal mode: Squid uses direct egress. Tor mode: all Squid traffic is forced through the gateway with no fallback.</text>
</svg>
